name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same PDFium release the app ships (apps/desktop/scripts/pdfium.mjs).
  PDFIUM_TAG: chromium/8076

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners cost ten times as much in a private repository: on main only.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Access the private engine repository
        env:
          NIMBLEOFFICE_TOKEN: ${{ secrets.NIMBLEOFFICE_TOKEN }}
        run: git config --global url."https://x-access-token:${NIMBLEOFFICE_TOKEN}@github.com/Eliseowzy/nimbleoffice".insteadOf "https://github.com/Eliseowzy/nimbleoffice"
      - name: Activate pinned Rust toolchain
        run: rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: PDFium for the document tests
        run: |
          case "$RUNNER_OS" in
            Linux) archive=pdfium-linux-x64.tgz; lib=libpdfium.so ;;
            macOS) archive=pdfium-mac-arm64.tgz; lib=libpdfium.dylib ;;
          esac
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/$archive" | tar xz -C "$RUNNER_TEMP/pdfium"
          echo "FINX_PDFIUM=$RUNNER_TEMP/pdfium/lib/$lib" >> "$GITHUB_ENV"
      # The spatial_script sandbox e2e test (macOS only) runs Python through uv.
      - uses: astral-sh/setup-uv@v6
        if: runner.os == 'macOS'
      - name: Rust tests, every crate
        run: cargo test --locked --workspace --no-fail-fast
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: The public build compiles and the generated reference is current
        run: |
          cargo check --locked -p finx-cli --no-default-features
          node tools/gen-protocol-docs.mjs --check
          sh tools/check-public.sh
      - name: Client and desktop tests
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/protocol test
          pnpm --dir packages/client test
          pnpm --dir apps/desktop typecheck
          pnpm --dir apps/desktop test
